# Railway / Nixpacks: install Playwright browser + OS deps before Next build.
# Override in Railway UI if you prefer a custom Build Command instead.

[phases.setup]
# Ensure runtime has shared libraries required by Playwright headless shell.
# Ref: https://playwright.dev/docs/ci#requirements and Nixpacks aptPkgs docs.
aptPkgs = [
  "...",
  "libglib2.0-0",
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libdbus-1-3",
  "libxkbcommon0",
  "libatspi2.0-0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpangocairo-1.0-0",
  "libpango-1.0-0",
  "libcairo2",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxext6",
  "libxshmfence1",
  "ca-certificates",
  "fonts-liberation",
]

[phases.build]
# Playwright 1.50+ uses chromium-headless-shell for headless: true (separate from full chromium).
cmds = [
  "PLAYWRIGHT_BROWSERS_PATH=/app/.playwright-browsers npx playwright install --with-deps chromium chromium-headless-shell",
  "npm run build",
]

